<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore music classes for kids, teens and adults at UPBEAT Music Academy."
    />
    <title>Sign Up | UPBEAT Music Academy</title>
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <script src="../assets/js/preferences.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script type="module" src="../assets/js/auth.js"></script>
  </head>
  <body data-page="signup">
    <main id="main" tabindex="-1">
      <section class="auth-card">
        <div data-auth-brand><a href="../index.html">UPBEAT Music Academy</a></div>
        <h1>Create an account</h1>
        <form method="dialog" class="form-stack" data-auth>
          <label class="field" for="full-name"
            >Full name<input
              id="full-name"
              name="full-name"
              type="text"
              autocomplete="name"
              required
              maxlength="80" /></label
          ><label class="field" for="email"
            >Email<input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="120"
          /></label>
          <div class="password">
            <label class="field" for="password"
              >Password<input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8" /></label
            ><button
              class="button"
              type="button"
              data-password="password"
              aria-controls="password"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
          <div class="password">
            <label class="field" for="confirmation"
              >Confirm password<input
                id="confirmation"
                name="confirmation"
                type="password"
                autocomplete="new-password"
                required
                minlength="8" /></label
            ><button
              class="button"
              type="button"
              data-password="confirmation"
              aria-controls="confirmation"
              aria-label="Show confirm password"
            >
              Show
            </button>
          </div>
          <button class="button accent" type="submit">Create account</button>
        </form>
        <div class="auth-providers">
          <button type="button" class="button" data-provider="Google">
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.2 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.23 5.47-4.74 7.15l7.73 6C44.44 38 46.98 31.87 46.98 24.55z"
              />
              <path
                fill="#FBBC05"
                d="M10.54 28.59C10.06 27.14 9.8 25.6 9.8 24s.26-3.14.74-4.59l-7.98-6.19A23.81 23.81 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.93-5.83l-7.73-6c-2.15 1.45-4.92 2.3-8.2 2.3-6.26 0-11.57-4.21-13.46-9.88l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              />
            </svg>
            Google</button
          ><button type="button" class="button" data-provider="Apple">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="currentColor">
              <path
                d="M17.1 12.4c0-2 1.6-3 1.7-3.1-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8C6.7 7.7 5 9.9 5 12.6c0 3.3 2.3 6.6 3.6 6.6.8 0 1.3-.6 2.5-.6 1.3 0 1.7.6 2.7.6 1.3 0 3-2.5 3.7-4.4-1.2-.5-2.4-1.5-2.4-2.4zM14.8 6c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.6-1 2.6 1 .1 2.1-.5 2.7-1.2z"
                transform="translate(1 1)"
              />
            </svg>
            Apple
          </button>
        </div>
        <p class="error auth-status" data-auth-status role="status" hidden></p>
        <p>Already have an account? <a href="login.html">Sign in</a></p>
        <p><a href="dashboard.html">Open Student Dashboard</a></p>
      </section>
    </main>
  </body>
</html>
